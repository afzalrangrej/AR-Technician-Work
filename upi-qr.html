<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Scan & Pay • AR Technician Work Official Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep: #07040f;
      --bg-dark: #0f0720;
      --primary: #b060ff;
      --primary-light: #c084fc;
      --cyan: #22d3ee;
      --cyan-neon: #00f2fe;
      --pink: #f472b6;
      --amber: #fbbf24;
      --green: #10b981;
      --green-glow: #34d399;
      --text: #ede9fe;
      --text-muted: #94a3b8;
      --text-dim: #c4b5fd;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #200d45 0%, #0c051a 50%, #05020c 100%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.25rem 1rem 3rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glows matching admin dashboard */
    .ambient-glow-1 {
      position: fixed;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(176, 96, 255, 0.2) 0%, transparent 70%);
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: fixed;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.16) 0%, transparent 70%);
      bottom: 40px;
      right: 5%;
      filter: blur(65px);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Bar */
    .top-navbar {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      position: relative;
      z-index: 2;
    }

    .btn-top-back {
      background: linear-gradient(135deg, rgba(176, 96, 255, 0.22), rgba(0, 242, 254, 0.22));
      border: 1.5px solid rgba(0, 242, 254, 0.5);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 0.5rem 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.25s ease;
      text-decoration: none;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.35);
    }

    .btn-top-back:hover {
      background: linear-gradient(135deg, rgba(176, 96, 255, 0.4), rgba(0, 242, 254, 0.4));
      border-color: #00f2fe;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
      transform: translateX(-3px);
    }

    .brand-center {
      text-align: right;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      background: linear-gradient(135deg, #00f2fe, #b060ff, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #34d399;
      animation: pulseLive 1.6s infinite;
    }

    @keyframes pulseLive {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.3);
        opacity: 0.6;
      }
    }

    /* Main Container Card with Animated Cyber Border */
    .qr-main-card {
      background: radial-gradient(circle at 50% 0%, rgba(176, 96, 255, 0.22), transparent 75%),
        linear-gradient(145deg, rgba(24, 11, 50, 0.98), rgba(13, 5, 28, 0.99)) padding-box,
        linear-gradient(135deg, #00f2fe 0%, #b060ff 25%, #f472b6 50%, #fbbf24 75%, #10b981 100%) border-box;
      border: 2.5px solid transparent;
      border-radius: 24px;
      background-size: 250% 250%;
      animation: modalCyberBorderFlow 6s ease infinite;
      box-shadow: 0 0 50px rgba(176, 96, 255, 0.35), 0 0 100px rgba(0, 242, 254, 0.25), 0 30px 80px rgba(0, 0, 0, 0.85);
      width: 100%;
      max-width: 460px;
      padding: 1.5rem 1.4rem;
      text-align: center;
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 2;
    }

    @keyframes modalCyberBorderFlow {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 0 40px rgba(0, 242, 254, 0.4), 0 0 70px rgba(176, 96, 255, 0.3), 0 25px 60px rgba(0, 0, 0, 0.9);
      }

      33% {
        background-position: 50% 100%;
        box-shadow: 0 0 40px rgba(176, 96, 255, 0.45), 0 0 70px rgba(244, 114, 182, 0.35), 0 25px 60px rgba(0, 0, 0, 0.9);
      }

      66% {
        background-position: 100% 50%;
        box-shadow: 0 0 40px rgba(244, 114, 182, 0.45), 0 0 70px rgba(251, 191, 36, 0.3), 0 25px 60px rgba(0, 0, 0, 0.9);
      }

      100% {
        background-position: 0% 50%;
        box-shadow: 0 0 40px rgba(0, 242, 254, 0.4), 0 0 70px rgba(176, 96, 255, 0.3), 0 25px 60px rgba(0, 0, 0, 0.9);
      }
    }

    /* Payable Amount Banner */
    .amount-badge {
      display: block;
      margin-bottom: 1.1rem;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(0, 242, 254, 0.14));
      border: 1.5px solid rgba(16, 185, 129, 0.45);
      border-radius: 14px;
      padding: 0.7rem 1.25rem;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }

    .amount-badge .amt-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #a7f3d0;
      font-weight: 700;
    }

    .amount-badge .amt-val {
      font-size: 1.85rem;
      font-weight: 900;
      color: #34d399;
      font-family: 'Outfit', sans-serif;
      text-shadow: 0 0 16px rgba(52, 211, 153, 0.55);
      margin-top: 2px;
    }

    .amount-badge .amt-cust {
      font-size: 0.8rem;
      color: #e2e8f0;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Colorful Cyber QR Frame with Animated Border Flow */
    .qr-cyber-frame {
      position: relative;
      background: linear-gradient(145deg, rgba(20, 9, 42, 0.96), rgba(11, 4, 24, 0.98)) padding-box,
        linear-gradient(135deg, #00f2fe 0%, #b060ff 25%, #f472b6 50%, #fbbf24 75%, #10b981 100%) border-box;
      border: 2.5px solid transparent;
      border-radius: 20px;
      background-size: 250% 250%;
      animation: cyberFrameBorderFlow 4s ease infinite;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.45), 0 0 70px rgba(176, 96, 255, 0.35), 0 18px 45px rgba(0, 0, 0, 0.8);
      margin: 0.6rem auto 1.15rem;
      padding: 10px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    @keyframes cyberFrameBorderFlow {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 0 28px rgba(0, 242, 254, 0.5), 0 0 50px rgba(176, 96, 255, 0.35);
      }

      50% {
        background-position: 100% 50%;
        box-shadow: 0 0 28px rgba(244, 114, 182, 0.55), 0 0 50px rgba(251, 191, 36, 0.35);
      }

      100% {
        background-position: 0% 50%;
        box-shadow: 0 0 28px rgba(0, 242, 254, 0.5), 0 0 50px rgba(176, 96, 255, 0.35);
      }
    }

    .qr-img-styled {
      width: 100%;
      max-width: 360px;
      height: auto;
      display: block;
      border-radius: 12px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* UPI ID Box with 1-Click Copy and Animated Cyber Border */
    .upi-id-box {
      background: linear-gradient(135deg, rgba(25, 12, 50, 0.95), rgba(15, 7, 30, 0.98)) padding-box,
        linear-gradient(135deg, #00f2fe, #b060ff, #f472b6, #00f2fe) border-box;
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.15rem;
      background-size: 250% 250%;
      animation: cyberFrameBorderFlow 4s ease infinite;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }

    .upi-id-box .upi-text {
      text-align: left;
      overflow: hidden;
    }

    .upi-id-box .upi-label {
      font-size: 0.66rem;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 700;
    }

    .upi-id-box .upi-val {
      font-size: 0.92rem;
      font-weight: 800;
      color: #22d3ee;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.4px;
    }

    .btn-copy {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.28), rgba(176, 96, 255, 0.28));
      border: 1.5px solid #00f2fe;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.45rem 0.95rem;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
    }

    .btn-copy:hover {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.45), rgba(176, 96, 255, 0.45));
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.6);
      transform: translateY(-1px);
    }

    /* Actions Grid */
    .actions-grid {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1rem;
    }

    .btn-action {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border-radius: 11px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-action.back {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .btn-action.back:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-action.print {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.45);
    }

    .btn-action.print:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.7);
      transform: translateY(-1px);
    }

    /* Merchant Verification Footer */
    .merchant-footer {
      border-top: 1px solid rgba(176, 96, 255, 0.2);
      padding-top: 0.9rem;
      margin-top: 0.5rem;
    }

    .merchant-footer p {
      font-size: 0.73rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .merchant-footer .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #34d399;
      font-weight: 700;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 0.65rem 1.4rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(16, 185, 129, 0.6);
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes toastSlideUp {
      from {
        transform: translate(-50%, 20px);
        opacity: 0;
      }

      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    /* Print Styles */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }

      .ambient-glow-1,
      .ambient-glow-2,
      .top-navbar,
      .actions-grid,
      .btn-copy,
      .toast {
        display: none !important;
      }

      .qr-main-card {
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
        padding: 0 !important;
        max-width: 100% !important;
      }

      .qr-cyber-frame {
        border: 2px solid #000 !important;
        box-shadow: none !important;
        background: #fff !important;
      }

      .qr-img-styled {
        width: 380px !important;
      }

      .upi-id-box {
        background: #f1f5f9 !important;
        border: 1px solid #cbd5e1 !important;
        color: #000 !important;
      }

      .upi-id-box .upi-val {
        color: #000 !important;
      }

      .merchant-footer p,
      .merchant-footer .secure-badge {
        color: #000 !important;
      }
    }
  </style>
</head>

<body>
  <!-- Ambient background lighting matching Admin Portal -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top Navigation Bar -->
  <div class="top-navbar">
    <button type="button" class="btn-top-back" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> Back
    </button>
    <div class="brand-center">
      <div class="brand-title">
        <i class="fas fa-screwdriver-wrench" style="color:#00f2fe;"></i> AR Technician Work
      </div>
      <div class="brand-subtitle">
        <span class="pulse-dot"></span> Admin Operations Suite
      </div>
    </div>
  </div>

  <!-- Main Cyber Container Card -->
  <div class="qr-main-card">
    <!-- Live Amount Banner if Query Parameter is set -->
    <div id="amount-container" class="amount-badge" style="display:none;">
      <div class="amt-label">Payable Collection Amount</div>
      <div class="amt-val" id="amount-display">₹0</div>
      <div id="customer-name-display" class="amt-cust"></div>
    </div>

    <!-- Colorful Cyber QR Frame -->
    <div class="qr-cyber-frame">
      <img src="images/upi-qr.jpg" alt="A R Technician Work Google Pay QR" class="qr-img-styled">
    </div>

    <!-- Official UPI ID Box with 1-Click Copy -->
    <div class="upi-id-box">
      <div class="upi-text">
        <div class="upi-label">Official Merchant UPI ID</div>
        <div class="upi-val">6351618067@okbizaxis</div>
      </div>
      <button type="button" class="btn-copy" onclick="copyUpi()">
        <i class="fas fa-copy" style="color:#00f2fe;"></i> <span id="copy-text">Copy</span>
      </button>
    </div>

    <!-- Action Buttons with Back and Print -->
    <div class="actions-grid">
      <button type="button" class="btn-action back" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Back to Form
      </button>
      <button type="button" class="btn-action print" onclick="window.print()">
        <i class="fas fa-print"></i> Print Official QR
      </button>
    </div>

    <!-- Merchant Trust Footer -->
    <div class="merchant-footer">
      <div class="secure-badge">
        <i class="fas fa-shield-halved"></i> 100% Secure Instant Bank Settlement
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i> <span id="toast-msg">UPI ID copied!</span>
  </div>

  <script>
    function goBack() {
      if (document.referrer && document.referrer !== window.location.href) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    function copyUpi() {
      const upi = '6351618067@okbizaxis';
      navigator.clipboard.writeText(upi).then(() => {
        const text = document.getElementById('copy-text');
        text.textContent = 'Copied!';
        showToast('✅ UPI ID copied: ' + upi);
        setTimeout(() => { text.textContent = 'Copy'; }, 2000);
      }).catch(() => {
        showToast('UPI ID: ' + upi);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const m = document.getElementById('toast-msg');
      m.textContent = msg;
      t.style.display = 'inline-flex';
      setTimeout(() => { t.style.display = 'none'; }, 1000);
    }

    // Parse URL params for amount & customer name
    const params = new URLSearchParams(window.location.search);
    const amt = params.get('amount') || params.get('amt');
    const name = params.get('name') || params.get('customer');
    if (amt && parseFloat(amt) > 0) {
      document.getElementById('amount-container').style.display = 'block';
      document.getElementById('amount-display').textContent = '₹' + parseFloat(amt).toLocaleString('en-IN');
      if (name) {
        document.getElementById('customer-name-display').textContent = 'Customer: ' + decodeURIComponent(name);
      }
    }
  </script>
</body>

</html>
